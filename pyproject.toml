[project]
name = "scannex"
version = "0.1.0"
description = "Autonomous AppSec Verification & Speculative Remediation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "bandit>=1.7.8",
    "semgrep>=1.60.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
ai = [
    "litellm>=1.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
scannex = "scannex.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scannex*"]
exclude = ["test_target*", "tests*"]

[tool.setuptools.package-data]
"scannex.web" = ["templates/*"]
"scannex.benchmark.vulnerable_flask_app" = ["*"]
